version=4.1.0
# mode, host and http-logging-level are overwritten at build time by processResources in build.gradle.
# Editing them here has NO effect. Set Gradle properties instead:
#   appMode=dev|prod (default prod), appHost=dev|prod (default = appMode),
#   httpLoggingLevel=NONE|BASIC|HEADERS|BODY (default BODY for dev, NONE for prod)
# e.g. `appMode=dev` in ~/.gradle/gradle.properties, or `gradlew run -PappMode=dev`.
# The values below are only a fallback for builds that bypass Gradle.
mode=prod
host=prod
#rest-api
rest-api-ver=2.1
http-logging-level=NONE
